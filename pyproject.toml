[project]
name = "ossdigest"
version = "0.1.0"
description = "Telegram-бот Open Source Digest: сбор, отбор и публикация постов о новых open source проектах"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "jinja2>=3.1",
    "azure-identity>=1.17",
    "psycopg[binary]>=3.1",
]

[project.scripts]
ossdigest-collector = "ossdigest.collector:main"
ossdigest-publisher = "ossdigest.publisher:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "freezegun>=1.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ossdigest"]
